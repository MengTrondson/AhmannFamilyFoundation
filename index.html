<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmann Family Foundation</title>
<meta name="description" content="The Ahmann Family Foundation supports organizations whose work leads people to a better future and helps individuals in need create a more positive life.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a38;--teal:#1f5f6b;--sky:#e4eef3;--serif:"Newsreader",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--serif);color:var(--ink);background:#fff;display:flex;flex-direction:column;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
h1,h2,p{margin:0}

header.site{background:#fff;border-bottom:1px solid #d3dee5}
header.site .wrap{display:flex;align-items:center;min-height:68px}
.brand{font-weight:600;font-size:1.4rem;letter-spacing:.01em}

.hero{flex:1;background:linear-gradient(180deg,#f6e3bd 0%,#f3efe2 38%,var(--sky) 100%);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.hero .wrap{padding-top:80px;width:100%}
.hero h1{font-weight:600;font-size:clamp(2.4rem,6vw,4.2rem);line-height:1.12;letter-spacing:-.01em;max-width:14em}
.hero svg{display:block;width:100%;height:auto;margin-top:32px}

.mission{background:var(--teal);color:#fff;padding:72px 0}
.mission h2{font-weight:600;font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:.6em}
.mission p{font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.45;max-width:34em}
</style>
</head>
<body>

<header class="site">
  <div class="wrap"><span class="brand">Ahmann Family Foundation</span></div>
</header>

<main class="hero">
  <div class="wrap">
    <h1>Helping people move toward a better future.</h1>
  </div>
  <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" role="img" aria-label="A path winding over hills toward a rising sun">
    <circle cx="840" cy="190" r="84" fill="#e3a13a" opacity=".9"/>
    <circle cx="840" cy="190" r="130" fill="#e3a13a" opacity=".18"/>
    <path d="M0 230 Q220 150 440 205 T900 190 T1200 170 V300 H0Z" fill="#8fb5bf"/>
    <path d="M0 262 Q260 195 520 245 T1200 215 V300 H0Z" fill="#4c8794"/>
    <path d="M0 290 Q300 240 600 275 T1200 250 V300 H0Z" fill="#1f5f6b"/>
    <path d="M470 300 C 560 262, 700 270, 790 238 S 900 196, 936 180" fill="none" stroke="#f6e3bd" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 16"/>
  </svg>
</main>

<section class="mission" id="mission">
  <div class="wrap">
    <h2>Our mission</h2>
    <p>The mission and charitable purpose of the Ahmann Family Foundation are to support organizations whose work leads people to a better future and help individuals, in need, create a more positive life.</p>
  </div>
</section>

</body>
</html>
